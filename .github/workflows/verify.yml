name: Verify

# Every push to main and every pull request must pass the same checks as `yarn check`, plus a
# production build, before it can be merged or deployed.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still checking an older one.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Yarn (version from package.json)
        run: corepack enable

      - name: Install dependencies exactly as locked
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn type:check

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
